# AWS Amplify Hosting build specification (Amplify Gen 2)
#
# The `backend` phase deploys the CDK-based backend defined in `amplify/` and
# writes `amplify_outputs.json` into the build workspace. The frontend build then
# picks that file up, so the deployed SPA talks to the real Cognito user pool and
# AppSync API without any hardcoded endpoints.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Runs `tsc --noEmit && vite build`, so a type error fails the deploy
        # rather than shipping a broken bundle.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
